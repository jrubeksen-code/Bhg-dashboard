<!DOCTYPE html>
<html lang="no">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>

body {

  font-family: Arial, sans-serif;

  margin: 20px;

  background-color: #f5f7fa;

  max-width: 1200px;

  margin-left: auto;

  margin-right: auto;

}


.dashboard {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 20px;

}


.card {

  background: white;

  border-radius: 12px;

  padding: 20px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.1);

  min-height: 220px;

}

h2 {

  margin-top: 0;

}


</style>

 
 

<p id="status">Laster data fra Azure...</p>
</head>
<body>
	<h1>Digitalt Morgenmøte</h1>
<div class="dashboard">


<div class="card">
	<h2>🔴 Kritiske avdelinger</h2>

<ul id="criticalDepartments">

</ul>
</div>


<div class="card">
	
	<h2>🟢 Avdelinger med kapasitet</h2>

<ul id="capacityDepartments">

</ul>


</div>


<div class="card">


<h2>💡 Forslag til bistand</h2>

<ul id="staffingSuggestions">

</ul>


</div>


<div class="card">


<h2>📊 Total situasjon</h2>

<ul id="summaryList">

</ul>
	</div>


</div>
	<script>


fetch("https://bhgdashboardfunc01-ekgffwfhbpeqdzek.norwayeast-01.azurewebsites.net/api/status-today")

  .then(response => response.json())

  .then(data => {

document.getElementById("status").innerText =

  "Barn: " +

  data.summary.childrenPresent +

  " | Ansatte: " +

  data.summary.staffPresent;
	  const criticalList =

  document.getElementById("criticalDepartments");


criticalList.innerHTML = "";


data.departmentsNeedingHelp.forEach(department => {


  const item = document.createElement("li");


  item.innerText = department.message;


  criticalList.appendChild(item);


});

const capacityList =

  document.getElementById("capacityDepartments");


capacityList.innerHTML = "";


data.departmentsWithCapacity.forEach(department => {


  const item = document.createElement("li");


  item.innerText = department.message;


  capacityList.appendChild(item);


});
	  const suggestionsList =

  document.getElementById("staffingSuggestions");
const summaryList =

  document.getElementById("summaryList");


summaryList.innerHTML = "";


summaryList.innerHTML =

  "<li>Barn til stede: " +

  data.summary.childrenPresent +

  "</li>" +

  "<li>Ansatte til stede: " +

  data.summary.staffPresent +

  "</li>" +

  "<li>Tilgjengelige ansatte: " +

  data.summary.availableStaff +

  "</li>";

suggestionsList.innerHTML = "";


data.staffingSuggestions.forEach(suggestion => {


  const item = document.createElement("li");


  item.innerText = suggestion.message;


  suggestionsList.appendChild(item);


});
 
	  })
  .catch(error => {

    document.getElementById("status").innerText =

      "Feil ved kontakt med Azure";

  });


</script>
</body>
</html>
