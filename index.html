<!DOCTYPE html>
<html lang="no">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<h1>Digitalt Morgenmøte</h1>

<p id="status">Laster data fra Azure...</p>
</head>
<body>
	<h1>Digitalt Morgenmøte</h1>

	<h2>🔴 Kritiske avdelinger</h2>

<ul id="criticalDepartments">

</ul>

	
	<h2>🟢 Avdelinger med kapasitet</h2>

<ul id="capacityDepartments">

</ul>

	<h2>💡 Forslag til bistand</h2>
	<ul>
		<li>Ida fra Maanen kan bistå Sola</li>
	</ul>

	<h2>📊 Total situasjon</h2>
	<ul>
		<li>Barn til stede: 12</li>
		<li>Ansatte til stede: 3</li>
		<li>Tilgjengelige ansatte: 2</li>
	</ul>
	<script>


fetch("https://bhgdashboardfunc01-ekgffwfhbpeqdzek.norwayeast-01.azurewebsites.net/api/status-today")

  .then(response => response.json())

  .then(data => {

document.getElementById("status").innerText =

  "Barn: " +

  data.summary.childrenPresent +

  " | Ansatte: " +

  data.summary.staffPresent;
	  const criticalList =

  document.getElementById("criticalDepartments");


criticalList.innerHTML = "";


data.departmentsNeedingHelp.forEach(department => {


  const item = document.createElement("li");


  item.innerText = department.message;


  criticalList.appendChild(item);


});

const capacityList =

  document.getElementById("capacityDepartments");


capacityList.innerHTML = "";


data.departmentsWithCapacity.forEach(department => {


  const item = document.createElement("li");


  item.innerText = department.message;


  capacityList.appendChild(item);


});
  .catch(error => {

    document.getElementById("status").innerText =

      "Feil ved kontakt med Azure";

  });


</script>
</body>
</html>
