<!DOCTYPE html>
<html>
 
<head>
 
<meta charset="UTF-8">
 
<title>Registrering</title>
 
<style>
 
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background-color: #f5f7fa;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}
 
.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
 
input,
select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 15px;
}
 
button {
  background: #0078d4;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}
 
</style>
 
</head>
 
<body>
 
<div class="card">
 
<h1>📝 Registrering</h1>
 
<div class="employee-card">
    <div class="name">Anne</div>
   <div class="status">✅ På jobb</div>
 style="background-color:#d4edda;"
 
</div>
 
<div class="employee-card">
    <div class="name">Ida</div>
    <div class="status">❌ Ikke på jobb</div>
</div>
 
<div class="employee-card">
    <div class="name">Kari</div>
    <div class="status">❌ Ikke på jobb</div>
</div>
 
 
 
</div>
  <script>
function toggleAttendance(card) {
 
    const status = card.querySelector(".status");
 
    if (status.innerText === "❌ Ikke på jobb") {
 
        status.innerText = "✅ På jobb";
        card.style.backgroundColor = "#d4edda";
 
        const now = new Date().toLocaleTimeString('no-NO', {
            hour: '2-digit',
            minute: '2-digit'
        });
 
        alert("Logget inn kl. " + now);
 
    } else {
 
        status.innerText = "❌ Ikke på jobb";
        card.style.backgroundColor = "#f8d7da";
 
        const now = new Date().toLocaleTimeString('no-NO', {
            hour: '2-digit',
            minute: '2-digit'
        });
 
        alert("Logget ut kl. " + now);
    }
}
</script>
</body>

 
</html>
