<!DOCTYPE html>

<title>Registrering</title>
<style>
 
body {
 
  font-family: Arial, sans-serif;
 
  margin: 0;
 
  background-color: #f5f7fa;
 
}
 
.card {
 
  background: light grey;
 
  min-height: 100vh;
 
  width: 100%;
 
  box-sizing: border-box;
 
  padding: 25px;
 
}
 
input,
 
select {
 
  width: 100%;
 
  padding: 10px;
 
  margin-top: 5px;
 
  margin-bottom: 15px;
 
}
 
button {
 
  background: #0078d4;
 
  color: white;
 
  border: none;
 
  padding: 10px 20px;
 
  border-radius: 8px;
 
  cursor: pointer;
 
}
 
.employee-grid {
 
    display: grid;
 
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
 
    gap: 20px;
 
    width: 100%;
 
}
 
.employee-card {
 
    background: white;
 
    height: 180px;
 
    border-radius: 16px;
 
    border: 1px solid #dddddd;
 
    cursor: pointer;
 
    display: flex;
 
    flex-direction: column;
 
    justify-content: center;
 
    align-items: center;
 
    padding: 10px;
 
    box-sizing: border-box;
 
}
 
.name {
 
    font-size: 14px;
 
    font-weight: 600;
 
    margin-top: 10px;
 
    text-align: center;
 
}
 
.status {
 
    display: none;
 
}
 
 
</style>
 
 
</head>
