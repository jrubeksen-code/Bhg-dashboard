<!DOCTYPE html>
<html>
 
<head>
 
<meta charset="UTF-8">
 
<title>Registrering</title>
 
<style>
 
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background-color: #f5f7fa;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}
 
.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
 
input,
select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 15px;
}
 
button {
  background: #0078d4;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}
 
</style>
 
</head>
 
<body>
 
<div class="card">
 
<h1>📝 Registrering</h1>
 
<p>Ansatt</p>
 
<select>
 
<option>Anne</option>
<option>Ida</option>
<option>Kari</option>
 
</select>
 
<p>Status</p>
 
<select>
 
<option>Til stede</option>
<option>Fraværende</option>
 
</select>
 
<p>Fra</p>
 
<input type="time">
 
<p>Til</p>
 
<input type="time">
 
<button>
Lagre
</button>
 
</div>
 
</body>
 
</html>
